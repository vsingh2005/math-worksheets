<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="initial-scale=1,user-scalable=no,width=device-width">
  <title>Kids STEM Studio Math Placement Portal</title>
  <script src="auth.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const session = localStorage.getItem('kss_session') || sessionStorage.getItem('kss_session');
      if (session) {
        window.location.href = 'portal.html';
      } else {
        window.location.href = 'login.html';
      }
    });
  </script>
</head>
<body style="background-color: #0f172a; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif;">
  <p>Loading Kids STEM Studio Math Placement Portal...</p>
</body>
</html>
